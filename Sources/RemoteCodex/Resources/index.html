<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: remote-codex-media:; media-src remote-codex-media:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'"></head><body><div id="codex-message-concept" aria-label="Codex 风格客户端与可收起的消息侧栏">
  <style>
    #codex-message-concept {
      --app-surface: light-dark(#ffffff, #202020);
      --app-sidebar: light-dark(#f4f3f0, #191919);
      --app-soft: light-dark(#f6f6f4, #292929);
      --app-hover: light-dark(#eae9e5, #303030);
      --app-selected: light-dark(#e7e6e1, #343434);
      --app-text: light-dark(#292824, #eeede9);
      --app-muted: light-dark(#7a7871, #a6a49e);
      --app-line: light-dark(#e7e6e1, #343432);
      --app-strong: light-dark(#292824, #ecebe6);
      --app-on-strong: light-dark(#ffffff, #242421);
      --app-green: light-dark(#32815b, #86bc9a);
      --app-red: light-dark(#ac655f, #d4958e);
      --app-wa: light-dark(#43825f, #8cc8a3);
      --app-tg: light-dark(#4b7b9e, #8bb8d7);
      --app-shadow: light-dark(#22221c0a, #00000020);
      --message-width: 302px;
      --navigation-width: 181px;
      --right-width: var(--message-width);
      color-scheme: light dark;
      color: var(--app-text);
      font: calc(13px * var(--font-scale, 1))/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      width: 100%;
    }
    #codex-message-concept *, #codex-message-concept *::before, #codex-message-concept *::after { box-sizing: border-box; }
    #codex-message-concept [hidden] { display: none !important; }
    #codex-message-concept button, #codex-message-concept textarea { font: inherit; color: inherit; }
    #codex-message-concept button { -webkit-tap-highlight-color: transparent; }
    #codex-message-concept button:focus-visible, #codex-message-concept textarea:focus-visible { outline: 2px solid var(--app-muted); outline-offset: 3px; }
    #codex-message-concept button { border: 0; background: transparent; }
    #codex-message-concept button:hover { background: var(--app-hover); }
    #codex-message-concept .app { background: var(--app-surface); border: 1px solid var(--app-line); border-radius: 13px; overflow: clip; box-shadow: 0 10px 36px var(--app-shadow); }
    #codex-message-concept .chrome { height: 49px; display: flex; align-items: center; gap: 10px; padding: 0 13px 0 16px; background: var(--app-sidebar); border-bottom: 1px solid var(--app-line); }
    #codex-message-concept .traffic { display: flex; gap: 7px; margin-right: 10px; }
    #codex-message-concept .traffic span { width: 10px; height: 10px; border: 1px solid var(--app-line); border-radius: 50%; background: var(--app-hover); }
    #codex-message-concept .chrome-title { font-size: calc(12px * var(--font-scale, 1)); color: var(--app-muted); }
    #codex-message-concept .chrome-end { margin-left: auto; color: var(--app-muted); font-size: calc(11px * var(--font-scale, 1)); padding-right: 5px; }
    #codex-message-concept .icon { width: 16px; height: 16px; flex: 0 0 auto; }
    #codex-message-concept .icon-button { width: 29px; height: 29px; display: inline-flex; justify-content: center; align-items: center; border-radius: 6px; padding: 0; }
    #codex-message-concept .workspace { display: grid; grid-template-columns: var(--navigation-width) minmax(0, 1fr) var(--right-width); min-height: 622px; }
    #codex-message-concept.is-collapsed { --right-width: 0px; }
    #codex-message-concept.is-nav-collapsed { --navigation-width: 0px; }
    #codex-message-concept .navigation { grid-column: 1; grid-row: 1; display: flex; flex-direction: column; min-width: 0; padding: 13px 10px 11px; background: var(--app-sidebar); }
    #codex-message-concept .nav-button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 9px; border-radius: 7px; font-size: calc(12px * var(--font-scale, 1)); }
    #codex-message-concept .nav-button .shortcut { margin-left: auto; font-size: calc(10px * var(--font-scale, 1)); color: var(--app-muted); }
    #codex-message-concept .nav-label { margin: 24px 9px 8px; color: var(--app-muted); font-size: calc(11px * var(--font-scale, 1)); }
    #codex-message-concept .project { display: flex; align-items: center; gap: 7px; padding: 6px 7px; font-weight: 500; font-size: calc(12px * var(--font-scale, 1)); }
    #codex-message-concept .project .icon { width: 14px; height: 14px; color: var(--app-muted); }
    #codex-message-concept .session { padding: 8px 8px 8px 23px; border-radius: 7px; font-size: calc(11px * var(--font-scale, 1)); overflow-wrap: anywhere; }
    #codex-message-concept .session.active { background: var(--app-selected); }
    #codex-message-concept .session.inactive { color: var(--app-muted); }
    #codex-message-concept .nav-bottom { margin-top: auto; padding-top: 25px; }
    #codex-message-concept .account { display: flex; align-items: center; gap: 8px; padding: 10px 7px 0; font-size: calc(12px * var(--font-scale, 1)); }
    #codex-message-concept .account-avatar { width: 23px; height: 23px; border: 1px solid var(--app-line); border-radius: 50%; display: grid; place-items: center; font-size: calc(10px * var(--font-scale, 1)); }
    #codex-message-concept .chat { grid-column: 2; grid-row: 1; display: flex; flex-direction: column; min-width: 0; border-left: 1px solid var(--app-line); }
    #codex-message-concept.is-nav-collapsed .chat { border-left: 0; }
    #codex-message-concept .chat-header { display: flex; align-items: center; gap: 9px; padding: 16px 21px 13px; min-height: 67px; }
    #codex-message-concept .chat-heading { min-width: 0; }
    #codex-message-concept .chat-heading h2 { font-size: calc(13px * var(--font-scale, 1)); font-weight: 500; line-height: 1.4; margin: 0; }
    #codex-message-concept .location { display: flex; align-items: center; gap: 5px; color: var(--app-muted); font-size: calc(10px * var(--font-scale, 1)); margin-top: 3px; }
    #codex-message-concept .location .icon { width: 11px; height: 11px; }
    #codex-message-concept .messages-toggle { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; padding: 5px 8px; border: 1px solid var(--app-line); border-radius: 7px; font-size: calc(11px * var(--font-scale, 1)); background: var(--app-surface); }
    #codex-message-concept .unread { display: grid; place-items: center; min-width: 16px; height: 16px; background: var(--app-selected); border-radius: 5px; padding: 0 3px; font-size: calc(10px * var(--font-scale, 1)); }
    #codex-message-concept .transcript { flex: 1; padding: 26px 25px 15px; }
    #codex-message-concept .user-message { background: var(--app-soft); max-width: 91%; width: fit-content; margin: 0 0 24px auto; padding: 11px 14px; border-radius: 13px 13px 3px 13px; font-size: calc(12px * var(--font-scale, 1)); }
    #codex-message-concept .assistant-message { font-size: calc(12px * var(--font-scale, 1)); line-height: 1.9; }
    #codex-message-concept .assistant-message p { margin: 0 0 14px; }
    #codex-message-concept .tool-line { display: flex; align-items: center; gap: 7px; color: var(--app-muted); margin: 17px 0; font-size: calc(11px * var(--font-scale, 1)); }
    #codex-message-concept .tool-line .icon { width: 13px; height: 13px; }
    #codex-message-concept .file-change { border: 1px solid var(--app-line); border-radius: 8px; margin-top: 17px; }
    #codex-message-concept .file-row { display: flex; align-items: center; gap: 7px; padding: 9px 10px; font-size: calc(11px * var(--font-scale, 1)); }
    #codex-message-concept .file-row .icon { width: 13px; height: 13px; color: var(--app-muted); }
    #codex-message-concept .file-stats { margin-left: auto; white-space: nowrap; font-size: calc(10px * var(--font-scale, 1)); }
    #codex-message-concept .additions { color: var(--app-green); }
    #codex-message-concept .deletions { color: var(--app-red); }
    #codex-message-concept .chat-actions { display: flex; gap: 8px; margin-top: 12px; color: var(--app-muted); }
    #codex-message-concept .chat-actions .icon { width: 13px; height: 13px; }
    #codex-message-concept .compose-wrap { padding: 11px 21px 14px; }
    #codex-message-concept .composer { border: 1px solid var(--app-line); border-radius: 15px; padding: 11px 12px 8px; box-shadow: 0 2px 8px var(--app-shadow); }
    #codex-message-concept textarea { display: block; background: transparent; border: 0; resize: none; width: 100%; min-width: 0; color: var(--app-text); }
    #codex-message-concept textarea::placeholder { color: var(--app-muted); opacity: 1; }
    #codex-message-concept .codex-input { min-height: 54px; max-height: 110px; font-size: calc(12px * var(--font-scale, 1)); line-height: 1.65; padding: 2px 1px; }
    #codex-message-concept .composer-footer { display: flex; align-items: center; gap: 8px; color: var(--app-muted); font-size: calc(10px * var(--font-scale, 1)); }
    #codex-message-concept .model { display: inline-flex; align-items: center; gap: 5px; }
    #codex-message-concept .model .icon { width: 11px; height: 11px; }
    #codex-message-concept .send { margin-left: auto; width: 27px; height: 27px; border-radius: 50%; background: var(--app-strong); color: var(--app-on-strong); display: grid; place-items: center; padding: 0; }
    #codex-message-concept .send:hover { background: var(--app-muted); }
    #codex-message-concept .send .icon { width: 15px; height: 15px; }
    #codex-message-concept .source-chip { display: flex; align-items: flex-start; gap: 7px; background: var(--app-soft); border-radius: 8px; padding: 8px; margin-bottom: 8px; font-size: calc(11px * var(--font-scale, 1)); }
    #codex-message-concept .source-chip > .icon { width: 13px; height: 13px; color: var(--app-muted); margin-top: 2px; }
    #codex-message-concept .source-copy { flex: 1; min-width: 0; }
    #codex-message-concept .source-label { font-size: calc(10px * var(--font-scale, 1)); color: var(--app-muted); }
    #codex-message-concept .source-excerpt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #codex-message-concept .source-chip .icon-button { width: 18px; height: 18px; }
    #codex-message-concept .messages { grid-column: 3; grid-row: 1; display: flex; flex-direction: column; min-width: 0; border-left: 1px solid var(--app-line); background: var(--app-surface); }
    #codex-message-concept .platforms { display: flex; gap: 5px; padding: 16px 13px 12px; border-bottom: 1px solid var(--app-line); }
    #codex-message-concept .platform { display: flex; align-items: center; justify-content: center; gap: 5px; flex: 1; padding: 6px 8px; border-radius: 6px; font-size: calc(11px * var(--font-scale, 1)); color: var(--app-muted); }
    #codex-message-concept .platform[aria-selected="true"] { background: var(--app-soft); color: var(--app-text); }
    #codex-message-concept .platform .icon { width: 13px; height: 13px; }
    #codex-message-concept .platform[data-platform="wa"] .icon { color: var(--app-wa); }
    #codex-message-concept .platform[data-platform="tg"] .icon { color: var(--app-tg); }
    #codex-message-concept .conversation-switcher { position: relative; z-index: 2; padding: 6px 8px 0; }
    #codex-message-concept .conversation-heading { width: 100%; padding: 9px 7px; display: flex; align-items: center; gap: 8px; text-align: left; border-radius: 8px; }
    #codex-message-concept .conversation-heading:hover, #codex-message-concept .conversation-heading[aria-expanded="true"] { background: var(--app-soft); }
    #codex-message-concept .conversation-heading .contact-copy { flex: 1; min-width: 0; }
    #codex-message-concept .conversation-heading > .icon { width: 13px; height: 13px; color: var(--app-muted); margin-left: auto; }
    #codex-message-concept .conversation-picker { position: absolute; top: calc(100% + 3px); left: 6px; right: 6px; padding: 7px; background: var(--app-surface); border: 1px solid var(--app-line); border-radius: 11px; box-shadow: 0 10px 28px var(--app-shadow), 0 3px 10px var(--app-shadow); }
    #codex-message-concept .picker-title { color: var(--app-muted); font-size: calc(10px * var(--font-scale, 1)); padding: 5px 7px 6px; }
    #codex-message-concept .picker-section { color: var(--app-muted); font-size: calc(10px * var(--font-scale, 1)); padding: 9px 7px 4px; }
    #codex-message-concept .conversation-option { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 7px; text-align: left; border-radius: 7px; }
    #codex-message-concept .conversation-option[aria-pressed="true"] { background: var(--app-soft); }
    #codex-message-concept .option-avatar { width: 27px; height: 27px; display: grid; place-items: center; flex: 0 0 auto; border: 1px solid var(--app-line); border-radius: 8px; color: var(--app-muted); }
    #codex-message-concept .option-avatar .icon { width: 13px; height: 13px; }
    #codex-message-concept .option-copy { flex: 1; min-width: 0; }
    #codex-message-concept .option-name { font-size: calc(11px * var(--font-scale, 1)); font-weight: 500; }
    #codex-message-concept .option-preview { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: calc(10px * var(--font-scale, 1)); color: var(--app-muted); margin-top: 2px; }
    #codex-message-concept .conversation-option > .icon { width: 13px; height: 13px; color: var(--app-muted); }
    #codex-message-concept .contact-avatar { width: 29px; height: 29px; border-radius: 9px; background: var(--app-soft); display: grid; place-items: center; font-size: calc(11px * var(--font-scale, 1)); flex: 0 0 auto; }
    #codex-message-concept .conversation-name { font-size: calc(12px * var(--font-scale, 1)); font-weight: 500; }
    #codex-message-concept .conversation-meta { color: var(--app-muted); font-size: calc(10px * var(--font-scale, 1)); }
    #codex-message-concept .conversation-feed { flex: 1; padding: 5px 14px 14px; }
    #codex-message-concept .day-divider { display: flex; align-items: center; gap: 9px; color: var(--app-muted); font-size: calc(10px * var(--font-scale, 1)); margin: 8px 0 15px; }
    #codex-message-concept .day-divider::before, #codex-message-concept .day-divider::after { content: ""; height: 1px; flex: 1; background: var(--app-line); }
    #codex-message-concept .message-item { border: 1px solid transparent; border-radius: 9px; padding: 8px 9px 5px; margin-bottom: 12px; }
    #codex-message-concept .message-item.is-quoted { border-color: var(--app-line); background: var(--app-soft); }
    #codex-message-concept .message-author { color: var(--app-muted); display: flex; align-items: center; gap: 7px; font-size: calc(10px * var(--font-scale, 1)); margin-bottom: 5px; }
    #codex-message-concept .message-author time { margin-left: auto; }
    #codex-message-concept .message-text { font-size: calc(12px * var(--font-scale, 1)); line-height: 1.75; overflow-wrap: anywhere; }
    #codex-message-concept .message-bottom { display: flex; justify-content: flex-end; padding-top: 6px; }
    #codex-message-concept .quote-button { display: inline-flex; align-items: center; gap: 4px; padding: 4px 5px; border-radius: 5px; color: var(--app-muted); font-size: calc(10px * var(--font-scale, 1)); }
    #codex-message-concept .quote-button .icon { width: 11px; height: 11px; }
    #codex-message-concept .outgoing { width: fit-content; max-width: 94%; background: var(--app-soft); border-radius: 9px 9px 2px 9px; margin: 0 0 14px auto; padding: 9px 11px; font-size: calc(12px * var(--font-scale, 1)); }
    #codex-message-concept .outgoing-meta { color: var(--app-muted); font-size: calc(10px * var(--font-scale, 1)); text-align: right; margin-top: 5px; }
    #codex-message-concept .reply-wrap { border-top: 1px solid var(--app-line); padding: 12px 14px 14px; }
    #codex-message-concept .reply-box { border: 1px solid var(--app-line); border-radius: 11px; padding: 9px 10px 7px; }
    #codex-message-concept .reply-input { min-height: 49px; max-height: 88px; padding: 0; font-size: calc(11px * var(--font-scale, 1)); line-height: 1.7; }
    #codex-message-concept .reply-footer { display: flex; align-items: center; font-size: calc(10px * var(--font-scale, 1)); color: var(--app-muted); }
    #codex-message-concept .reply-footer .send { width: 23px; height: 23px; }
    #codex-message-concept .confirmation { padding: 10px; border: 1px solid var(--app-line); border-radius: 9px; margin-top: 9px; background: var(--app-soft); }
    #codex-message-concept .confirmation p { font-size: calc(11px * var(--font-scale, 1)); margin: 5px 0 9px; overflow-wrap: anywhere; }
    #codex-message-concept .confirm-label { font-size: calc(10px * var(--font-scale, 1)); color: var(--app-muted); }
    #codex-message-concept .confirm-actions { display: flex; justify-content: flex-end; gap: 7px; }
    #codex-message-concept .small-button { font-size: calc(10px * var(--font-scale, 1)); border: 1px solid var(--app-line); padding: 4px 8px; border-radius: 5px; background: var(--app-surface); }
    #codex-message-concept .small-button.strong { background: var(--app-strong); color: var(--app-on-strong); }
    #codex-message-concept .demo-status { min-height: 14px; color: var(--app-muted); font-size: calc(10px * var(--font-scale, 1)); padding-top: 5px; }
    #codex-message-concept .sent-quote { padding: 7px 9px; margin-bottom: 6px; border-left: 2px solid var(--app-muted); font-size: calc(11px * var(--font-scale, 1)); color: var(--app-muted); }
    @media (max-width: 870px) {
      #codex-message-concept { --navigation-width: 148px; --message-width: 264px; }
      #codex-message-concept .chat-header { padding-inline: 15px; }
      #codex-message-concept .transcript { padding-inline: 17px; }
      #codex-message-concept .compose-wrap { padding-inline: 14px; }
    }
    @media (max-width: 710px) {
      #codex-message-concept .workspace { grid-template-columns: minmax(0, 1fr) var(--right-width); }
      #codex-message-concept .navigation { grid-column: 1 / -1; grid-row: 1; border-bottom: 1px solid var(--app-line); }
      #codex-message-concept .nav-bottom { display: none; }
      #codex-message-concept .chat { grid-column: 1; grid-row: 2; border-left: 0; }
      #codex-message-concept .messages { grid-column: 2; grid-row: 2; }
      #codex-message-concept .chrome-end { display: none; }
      #codex-message-concept .messages-toggle { margin-left: auto; }
    }
    @media (max-width: 530px) {
      #codex-message-concept .workspace { grid-template-columns: minmax(0, 1fr); }
      #codex-message-concept .messages { grid-column: 1; grid-row: 3; border-left: 0; border-top: 1px solid var(--app-line); }
      #codex-message-concept .chat { min-height: 520px; }
      #codex-message-concept .messages { min-height: 430px; }
      #codex-message-concept .message-item { margin-bottom: 5px; }
      #codex-message-concept .chrome-end { display: none; }
    }
    @media (pointer: coarse) {
      #codex-message-concept .icon-button, #codex-message-concept .quote-button, #codex-message-concept .platform { min-height: 40px; }
      #codex-message-concept textarea { font-size: calc(16px * var(--font-scale, 1)); }
    }
  </style>
  <div class="app">
    <div class="chrome">
      <div class="traffic" aria-hidden="true"><span></span><span></span><span></span></div>
      <button class="icon-button cursor-interaction" id="cmsg-navigation-toggle" type="button" aria-label="收起左侧项目栏" aria-expanded="true" aria-controls="cmsg-navigation"><i class="icon" data-lucide="panel-left" aria-hidden="true"></i></button>
      <span class="chrome-title">Codex</span>
      <span class="chrome-end">codex · 远程工作区</span>
      <button class="messages-toggle cursor-interaction" id="cmsg-toggle" type="button" aria-expanded="true" aria-controls="cmsg-sidebar"><i class="icon" data-lucide="panel-right" aria-hidden="true"></i>消息<span class="unread" hidden>0</span></button>
    </div>
    <div class="workspace">
      <nav class="navigation" id="cmsg-navigation" aria-label="项目与会话"><div class="nav-label">项目</div><div class="empty-state">正在读取远端会话…</div><div class="nav-bottom">
          <div class="nav-button"><i class="icon" data-lucide="settings-2" aria-hidden="true"></i>设置</div>
          <div class="account"><i class="icon" data-lucide="server" aria-hidden="true"></i><span>codex<span style="display:block;font-size:calc(10px * var(--font-scale, 1));color:var(--app-muted)">正在连接…</span></span></div>
        </div>
      </nav>
      <main class="chat" aria-label="Codex 对话">
        <header class="chat-header">
          <div class="chat-heading"><h2>新对话</h2><div class="location"><i class="icon" data-lucide="git-branch" aria-hidden="true"></i>远端工作区</div></div>
        </header>
        <div class="transcript" id="cmsg-transcript"><div class="empty-state">正在启动客户端…</div></div>
        <div class="compose-wrap">
          <div class="composer">
            <div class="source-chip" id="cmsg-source" hidden>
              <i class="icon" data-lucide="quote" aria-hidden="true"></i><div class="source-copy"><div class="source-label" id="cmsg-source-label"></div><div class="source-excerpt" id="cmsg-source-text"></div></div><button class="icon-button cursor-interaction" id="cmsg-remove" type="button" aria-label="移除引用"><i class="icon" data-lucide="x" aria-hidden="true"></i></button>
            </div>
            <textarea class="codex-input" id="cmsg-input" aria-label="发送给 Codex 的要求" placeholder="继续提问，或从右侧引用一条消息…"></textarea>
            <div class="composer-footer"><i class="icon" data-lucide="plus" aria-hidden="true"></i><span class="model">默认模型<i class="icon" data-lucide="chevron-down" aria-hidden="true"></i></span><button class="send cursor-interaction" id="cmsg-send-codex" type="button" aria-label="发送给 Codex"><i class="icon" data-lucide="arrow-up" aria-hidden="true"></i></button></div>
          </div>
        </div>
      </main>
      <aside class="messages" id="cmsg-sidebar" aria-label="WhatsApp 和 Telegram 消息侧栏">
        <div class="platforms" role="tablist" aria-label="消息平台">
          <button class="platform cursor-interaction" id="cmsg-tab-wa" data-platform="wa" type="button" role="tab" aria-selected="true" aria-controls="cmsg-feed"><i class="icon" data-lucide="message-circle" aria-hidden="true"></i>WhatsApp<span class="unread" hidden>0</span></button>
          <button class="platform cursor-interaction" id="cmsg-tab-tg" data-platform="tg" type="button" role="tab" aria-selected="false" aria-controls="cmsg-feed"><i class="icon" data-lucide="send" aria-hidden="true"></i>Telegram<span class="unread" hidden>0</span></button>
